name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[agent,test]"
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run offline test suite (Python 3.9)
        if: matrix.python-version == '3.9'
        run: python -m pytest
      - name: Run offline test suite with coverage gate (Python 3.12)
        if: matrix.python-version == '3.12'
        run: >-
          python -m coverage run --source=tc_agent,tc_template -m pytest
          && python -m coverage report --show-missing --fail-under=30
          && python -m coverage xml -o coverage.xml
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel contents and metadata
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl
          if ($wheel.Count -ne 1) { throw "Expected exactly one wheel, found $($wheel.Count)" }
          python -m zipfile -l $wheel.FullName
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          python -c "import tc_agent, tc_template; print(tc_template.__version__)"

  supply-chain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependency audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared runtime dependencies
        run: python -m pip_audit --strict .
      - name: Scan tracked production files for high-confidence secrets
        shell: pwsh
        run: |
          $filePatterns = @(
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----',
            'AKIA[0-9A-Z]{16}',
            'gh[pousr]_[A-Za-z0-9]{36,}'
          )
          $configPattern = '(api[_-]?key|secret|password)\s*[:=]\s*["''][^"'']{12,}["'']'
          $findings = [System.Collections.Generic.List[string]]::new()
          $trackedFiles = git ls-files
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed while scanning for secrets." }
          foreach ($file in $trackedFiles) {
            if ($file -match '^(tests|reference|knowledge_base)/' -or -not (Test-Path -LiteralPath $file -PathType Leaf)) {
              continue
            }
            $content = Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
            if ($null -eq $content) { continue }
            foreach ($pattern in $filePatterns) {
              if ($content -match $pattern) {
                $findings.Add($file)
                break
              }
            }
            if ($file -notmatch '^\.codex/agents/' -and $file -match '\.(toml|ya?ml|json|env|ini|cfg)$' -and $content -match $configPattern) {
              $findings.Add($file)
            }
          }
          if ($findings.Count) {
            $findings | Sort-Object -Unique | ForEach-Object { Write-Error "Potential secret in tracked file: $_" }
            throw "High-confidence secret material detected in tracked production files."
          }
