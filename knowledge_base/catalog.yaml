schema_version: 1
catalog_version: 2026-09-10
description: >-
  TwinCAT Agent knowledge sources. This catalog is the authority for what is
  maintained in knowledge_base and how each source may be used by the agent.

source_kinds:
  curated-summary: >-
    Human-maintained summary of a primary manual. Use for orientation and
    stable workflows; verify exact API details against docs_search/docs_read.
  implementation-contract: >-
    Repository-tested engineering contract. Use to constrain tool behavior;
    it does not replace the installed TwinCAT version or official docs.
  training-summary: >-
    Secondary training material condensed for onboarding. Use for concepts,
    not as evidence for version-sensitive API claims.
  operational-runbook: >-
    Repository workflow and safety guidance. It describes this agent, not
    TwinCAT itself.
  primary-source: >-
    Original manual retained for provenance. It is indexed page by page and
    should be cited when a curated summary is not sufficient.

authority_levels:
  official-manual-summary: "Official Beckhoff manual summarized by this repository"
  official-validated-contract: "Official documentation plus repository verification"
  internal-training-material: "Internal training material; secondary source"
  repository-observed: "Observed and tested behavior of this repository"
  official-manual: "Original Beckhoff manual"

